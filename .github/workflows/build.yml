name: NowBey Local APK Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd expo
          npm install

      - name: Expo Prebuild
        run: |
          cd expo
          npx expo prebuild --platform android --no-install

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || echo "Licenses already accepted"

      - name: Build Android APK (Low Memory Mode)
        run: |
          cd expo/android
          chmod +x gradlew
          # We set limited heap size and disable the daemon to prevent OOM hangs on GitHub runners
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            --no-daemon \
            --stacktrace \
            --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowbey-apk
          path: expo/android/app/build/outputs/apk/release/app-release.apk
