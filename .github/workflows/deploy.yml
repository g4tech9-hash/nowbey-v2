name: Deploy (Vercel + EAS)

on:
  # Production web deploy on every merge/push to master.
  push:
    branches: [master]
  # Manual knob in the Actions tab: web (Vercel prod), mobile (EAS APK), or all.
  workflow_dispatch:
    inputs:
      target:
        description: "What to run"
        required: true
        default: "web"
        type: choice
        options:
          - web
          - mobile
          - all

jobs:
  # Nothing reaches production until the code type-checks, lints, builds and passes the hermetic
  # unit tests. The live suites (endpoints / auth / mail / admin / UI) need Postgres and the SMTP
  # catcher, so they run locally with `npm run test:local` and `npm run test:ui`; the physical-device
  # push check stays on the human checklist in TODO_HUMAN.md.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # A build must not need production secrets; these keep Next.js from failing on a missing value.
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-web:
    needs: gate
    if: github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Needs repo secrets: VERCEL_TOKEN (vercel.com/account/tokens), plus VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID from .vercel/project.json locally or the project's Settings → General.
      - name: Deploy NowBey web to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Add the VERCEL_TOKEN secret (repo Settings > Secrets and variables > Actions)}"
          : "${VERCEL_ORG_ID:?Add the VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Add the VERCEL_PROJECT_ID secret}"
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee vercel-out.txt
          grep -Eo 'https://[a-zA-Z0-9./-]+\.vercel\.app' vercel-out.txt | head -1 >> "$GITHUB_STEP_SUMMARY" || true

  build-mobile:
    needs: gate
    # EAS minutes cost money, so the APK is built on demand only (Actions tab > Deploy > Run workflow > mobile),
    # or automatically right after a production web deploy when you choose "all".
    if: inputs.target == 'mobile' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install Expo dependencies
        working-directory: expo
        run: npm ci --no-audit --no-fund

      # google-services.json is a credential-bearing build input and must never be committed.
      # Store its complete JSON as the FIREBASE_GOOGLE_SERVICES_JSON Actions secret.
      - name: Install Firebase Android configuration
        working-directory: expo
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${FIREBASE_GOOGLE_SERVICES_JSON:?Add the FIREBASE_GOOGLE_SERVICES_JSON repository secret}"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > google-services.json
          node -e 'const f=require("./google-services.json"); if (!f.project_info?.project_id || !f.client?.some(c => c.client_info?.android_client_info?.package_name === "app.nowbey.mobile")) throw new Error("google-services.json does not contain app.nowbey.mobile")'

      # Needs repo secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
      - name: Send Android build to EAS (preview profile → APK)
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE: https://nowbey-v2.vercel.app
        run: |
          set -euo pipefail
          : "${EXPO_TOKEN:?Add the EXPO_TOKEN secret (repo Settings > Secrets and variables > Actions)}"
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
