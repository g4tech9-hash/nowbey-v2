name: Deploy (Vercel + EAS)

on:
  # Production web deploy on every merge/push to master.
  push:
    branches: [master]
  # The same knob, reachable from a script: POST a "deploy" repository_dispatch event with
  # client_payload {"target": "mobile"} to start a build with nobody opening the Actions tab.
  # workflow_dispatch needs the actions:write permission, which a deployment token does not always
  # have; repository_dispatch only needs the permission to push, so the job can be started from a
  # script, a bot or an agent. The target travels in the payload, and the build still runs on
  # master, and still has to pass the gate.
  repository_dispatch:
    types: [deploy]
  # Manual knob in the Actions tab: web (Vercel prod), mobile (EAS APK), or all.
  workflow_dispatch:
    inputs:
      target:
        description: "What to run"
        required: true
        default: "web"
        type: choice
        options:
          - web
          - mobile
          - all
          - smoke

jobs:
  # Nothing reaches production until the code type-checks, lints, builds and passes the hermetic
  # unit tests. The live suites (endpoints / auth / mail / admin / UI) need Postgres and the SMTP
  # catcher, so they run locally with `npm run test:local` and `npm run test:ui`; the physical-device
  # push check stays on the human checklist in TODO_HUMAN.md.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the unit tests import TypeScript directly, which needs Node's type stripping.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # A build must not need production secrets; these keep Next.js from failing on a missing value.
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-web:
    needs: gate
    if: github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'all' || github.event.client_payload.target == 'web' || github.event.client_payload.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Needs repo secrets: VERCEL_TOKEN (vercel.com/account/tokens), plus VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID from .vercel/project.json locally or the project's Settings → General.
      - name: Deploy NowBey web to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Add the VERCEL_TOKEN secret (repo Settings > Secrets and variables > Actions)}"
          : "${VERCEL_ORG_ID:?Add the VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Add the VERCEL_PROJECT_ID secret}"
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee vercel-out.txt
          grep -Eo 'https://[a-zA-Z0-9./-]+\.vercel\.app' vercel-out.txt | head -1 >> "$GITHUB_STEP_SUMMARY" || true

  # Read-only check of the live site: creates nothing, signs nobody in. After a web deploy it waits until
  # /api/health reports this commit, then checks the security headers, CORS, the origin wall, that the
  # app's sign-in path is still open, and that plans cannot be bought for free. Run it alone with
  # target "smoke" (Actions > Deploy > Run workflow, or repository_dispatch {"target":"smoke"}).
  smoke-web:
    needs: [gate, deploy-web]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.deploy-web.result == 'success' || inputs.target == 'smoke' || github.event.client_payload.target == 'smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the live site
        env:
          SMOKE_BASE: https://nowbey-v2.vercel.app
          EXPECT_SHA: ${{ needs.deploy-web.result == 'success' && github.sha || '' }}
        run: node scripts/smoke-prod.mjs

  build-mobile:
    needs: gate
    # EAS minutes cost money, so the APK is built on demand only (Actions tab > Deploy > Run workflow > mobile),
    # or automatically right after a production web deploy when you choose "all".
    if: inputs.target == 'mobile' || inputs.target == 'all' || github.event.client_payload.target == 'mobile' || github.event.client_payload.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the EAS CLI now says a future release will require Node 22 or newer, and
          # it says so on every build. The gate job already runs on 22.
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install Expo dependencies
        working-directory: expo
        run: npm ci --no-audit --no-fund

      # google-services.json is a credential-bearing build input and must never be committed.
      # Store its complete JSON as the FIREBASE_GOOGLE_SERVICES_JSON Actions secret.
      #
      # Writing the file is not enough on its own: EAS archives the project with the .gitignore rules
      # applied, and expo/.gitignore ignores this file, so for a long time the worker received an
      # app.json pointing at a file that had never been uploaded — the build failed before it
      # compiled anything. The root .easignore (used by EAS *instead of* every .gitignore) is what
      # lets the file travel while staying out of Git, so the last two checks below prove the
      # arrangement still holds and fail loudly if someone re-adds the rule there.
      - name: Install Firebase Android configuration
        working-directory: expo
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${FIREBASE_GOOGLE_SERVICES_JSON:?Add the FIREBASE_GOOGLE_SERVICES_JSON repository secret}"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > google-services.json
          node -e 'const f=require("./google-services.json"); if (!f.project_info?.project_id || !f.client?.some(c => c.client_info?.android_client_info?.package_name === "app.nowbey.mobile")) throw new Error("google-services.json does not contain app.nowbey.mobile")'

          test -s google-services.json
          test -f ../.easignore
          if grep -qE '^[[:space:]]*google-services\.json' ../.easignore; then
            echo "::error title=Firebase config would not reach EAS::.easignore now ignores google-services.json, so it will not be in the uploaded archive and the build will fail on the worker. Remove that rule."
            exit 1
          fi
          echo "google-services.json ($(wc -c < google-services.json) bytes) is present and .easignore keeps it eligible for the EAS upload."

      # Needs repo secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
      #
      # The identity check runs first on purpose: a rejected or missing token and a project that never
      # reaches the build worker both fail fast, and without this step the two look identical from the
      # outside (the raw step log lives on a storage host some clients cannot reach). With it, a red run
      # names its own cause in a single annotation.
      - name: Check EAS credentials
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          : "${EXPO_TOKEN:?Add the EXPO_TOKEN secret (repo Settings > Secrets and variables > Actions)}"
          set +e
          npx --yes eas-cli@latest whoami > eas-whoami.log 2>&1
          code=$?
          set -e
          cat eas-whoami.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=EAS rejected the EXPO_TOKEN::$(grep -v '^[[:space:]]*$' eas-whoami.log | tail -n 1 | tr -d '\r' | cut -c1-300)"
            exit "$code"
          fi

      # The step captures the build output instead of streaming it, so a failure can be turned into a
      # ::error annotation on the run's check: annotations are readable through the Checks API, while
      # the raw step log lives on a storage host that some clients cannot reach at all. A red run here
      # is therefore self-diagnosing wherever it is opened.
      #
      # The exit code alone does not say whether there is an APK: the CLI exits 0 for a build that was
      # cancelled on Expo's servers, exactly as it does for one that finished (it only counts ERRORED
      # as a failure). With --json the CLI prints the build record on stdout and its progress on
      # stderr, so the step reads the outcome from the record, and only FINISHED is green.
      - name: Send Android build to EAS (preview profile → APK)
        id: eas
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE: https://nowbey-v2.vercel.app
        run: |
          set -uo pipefail
          : "${EXPO_TOKEN:?Add the EXPO_TOKEN secret (repo Settings > Secrets and variables > Actions)}"
          set +e
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json 2> eas-build.log
          code=$?
          set -e
          tail -n 80 eas-build.log

          field() { jq -r "$1" eas-build.json 2>/dev/null || true; }
          id="$(field '.[0].id // empty')"
          status="$(field '.[0].status // empty')"
          page="$(field '.[0] | select(.app.ownerAccount.name and .app.slug) | "https://expo.dev/accounts/\(.app.ownerAccount.name)/projects/\(.app.slug)/builds/\(.id)"')"
          apk="$(field '.[0].artifacts.buildUrl // empty')"
          error="$(field '.[0].error | select(.) | [.errorCode, .message] | map(select(.)) | join(": ")')"
          echo "EAS build ${id:-(no build record)}: ${status:-unknown} (CLI exit $code)"

          case "$status" in
            FINISHED)
              {
                echo "### EAS build finished"
                echo ""
                echo "Build page: ${page:-unknown}"
                if [ -n "$apk" ]; then
                  echo ""
                  echo "APK: $apk"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=EAS build finished::${apk:-${page:-build $id}}"
              exit 0
              ;;
            CANCELED|PENDING_CANCEL)
              echo "::error title=EAS build was cancelled::Build $id was cancelled on Expo's servers, so there is no APK. ${page}"
              ;;
            ERRORED)
              echo "::error title=EAS build failed on the worker::${error:-the build record has no error message} ${page}"
              ;;
            "")
              # No build record: the CLI stopped before it started a build, or while it was waiting.
              first="$(grep -v '^[[:space:]]*$' eas-build.log | tail -n 1 | tr -d '\r' | cut -c1-300 || true)"
              echo "::error title=EAS build failed (exit $code)::$first"
              ;;
            *)
              echo "::error title=EAS build ended $status::Build $id did not finish, so there is no APK. ${page}"
              ;;
          esac
          echo "--- full output ---"
          cat eas-build.log
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          exit 1

      # The EAS step writes its output to a file, and the step log itself lives on a storage host
      # that some clients cannot reach. Uploading that file as an artifact puts the same text where
      # the API can serve it, so the reason for a red run can be read with the API alone — no
      # browser, no Actions tab, and no guessing from an exit code. It runs after the EAS step, and
      # it runs whether that step passed or failed, because the passing log is worth keeping too.
      - name: Upload the EAS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-log
          if-no-files-found: ignore
          path: |
            expo/eas-build.log
            expo/eas-build.json
            expo/eas-whoami.log

      # "Error: build command failed." is the CLI's last line whatever stopped it — an eas.json the
      # CLI refused, a worker that failed, a cancelled build — and the reason sits further up the log
      # or on the build record. Annotations are the one place the Checks API serves back, so the
      # reason is written there as well: the build record's status and error (read back with the same
      # token when the CLI did not print it) and the tail of the CLI output. A red run then names its
      # own cause instead of asking somebody to open expo.dev.
      - name: Report why the EAS build failed
        if: failure()
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          # The build record the EAS step printed with --json, when it got that far.
          build_id="$(jq -r '.[0].id // empty' eas-build.json 2>/dev/null || true)"
          if [ -z "$build_id" ]; then
            # Otherwise the build page the CLI links to when a build starts:
            # https://expo.dev/accounts/<owner>/projects/<slug>/builds/<id>
            build_id="$(grep -Eo 'https://expo\.dev/accounts/[^/[:space:]]+/projects/[^/[:space:]]+/builds/[0-9A-Fa-f-]+' eas-build.log 2>/dev/null | tail -n 1 | sed 's#.*/##' || true)"
          fi
          echo "build id: ${build_id:-none found in the log}"

          # Either record has the same shape: .status, and .error = { errorCode, message } when it failed.
          describe() { jq -r '(if type == "array" then .[0] else . end) | select(.) | [("status " + (.status // "unknown")), ((.error // {}) | [.errorCode, .message] | map(select(.)) | join(": "))] | map(select(. != "")) | join(" — ")' "$1" 2>/dev/null || true; }
          reason="$(describe eas-build.json)"
          if [ -z "$reason" ] && [ -n "$build_id" ]; then
            # build:view takes --json and nothing else: it has no --non-interactive flag, and an
            # unknown flag makes it refuse to run.
            npx --yes eas-cli@latest build:view "$build_id" --json > eas-view.json 2> eas-view.err || true
            reason="$(describe eas-view.json)"
          fi
          if [ -n "$reason" ]; then
            reason="$(printf '%s\n\n%s' "$reason" "$(tail -n 40 eas-build.log 2>/dev/null | tr -d '\r' | head -c 8000)")"
          fi
          if [ -z "$reason" ]; then
            reason="$(tail -n 60 eas-build.log 2>/dev/null | tr -d '\r' | head -c 12000 || true)"
          fi
          if [ -z "$reason" ]; then
            reason="the EAS build failed and no output was captured"
          fi

          {
            echo "### Why the EAS build failed"
            echo ""
            echo "Build id: ${build_id:-unknown}"
            echo ""
            echo '```'
            printf '%s\n' "$reason"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # One annotation, one line: newlines become %0A, percent signs %25, carriage returns %0D.
          payload="$(printf '%s' "$reason" | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/\r/,"%0D"); printf "%s%%0A", $0}')"
          printf '::error title=EAS build output::%s\n' "$payload"
