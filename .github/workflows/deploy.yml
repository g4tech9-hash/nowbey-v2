name: Deploy (Vercel + EAS)

on:
  # Production web deploy on every merge/push to master.
  push:
    branches: [master]
  # The same knob, reachable from a script: POST a "deploy" repository_dispatch event with
  # client_payload {"target": "mobile"} to start a build with nobody opening the Actions tab.
  # workflow_dispatch needs the actions:write permission, which a deployment token does not always
  # have; repository_dispatch only needs the permission to push, so the job can be started from a
  # script, a bot or an agent. The target travels in the payload, and the build still runs on
  # master, and still has to pass the gate.
  repository_dispatch:
    types: [deploy]
  # Manual knob in the Actions tab: web (Vercel prod), mobile (EAS Android APK), all (both),
  # or smoke.
  workflow_dispatch:
    inputs:
      target:
        description: "What to run"
        required: true
        default: "web"
        type: choice
        options:
          - web
          - mobile
          - all
          - smoke

jobs:
  # Nothing reaches production until the code type-checks, lints, builds and passes the hermetic
  # unit tests.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-web:
    needs: gate
    if: github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'all' || github.event.client_payload.target == 'web' || github.event.client_payload.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Needs repo secrets: VERCEL_TOKEN (vercel.com/account/tokens), plus VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID from .vercel/project.json locally or the project's Settings → General.
      # See docs/AUTH_DEPLOY_STATUS.md for the token-scope rules (must be Full Account, saved at
      # Repository scope, not Production/Preview environment scope).
      - name: Deploy NowBey web to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          PROD_BASE="https://nowbey-v2.vercel.app"
          EXPECT_SHA="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-12)"

          fp() { printf '%s' "$1" | sha256sum | cut -c1-8; }
          describe() { printf '%-18s length=%-5s sha256:%s\n' "$1" "${#2}" "$(fp "$2")"; }

          raw_token="${VERCEL_TOKEN:-}"
          token="$(printf '%s' "$raw_token" | tr -d '[:space:]' | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/" -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          raw_lines="$(printf '%s\n' "$raw_token" | grep -c . || true)"
          raw_ws="$(printf '%s' "$raw_token" | tr -cd '[:space:]' | wc -c | tr -d ' ')"
          if [ "$token" != "$raw_token" ]; then
            echo "VERCEL_TOKEN carried whitespace or quotes; they were removed before use."
          fi
          if [ "${raw_lines:-0}" -gt 1 ]; then
            echo "VERCEL_TOKEN has $raw_lines non-empty lines; a Vercel token is one unbroken string."
          fi

          echo "== secrets handed to this step (values are never printed) =="
          describe VERCEL_TOKEN      "$token"
          describe VERCEL_ORG_ID     "${VERCEL_ORG_ID:-}"
          describe VERCEL_PROJECT_ID "${VERCEL_PROJECT_ID:-}"
          printf '%-18s lines=%-3s raw_whitespace=%-3s\n' VERCEL_TOKEN "$raw_lines" "$raw_ws"

          live_sha() {
            curl -fsS --max-time 20 "${PROD_BASE}/api/health?t=$(date +%s%N)" 2>/dev/null \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1 || true
          }

          wait_for_release() {
            local deadline=$((SECONDS + $1)) last=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              last="$(live_sha || true)"
              if [ -n "$last" ] && [ "$last" = "$EXPECT_SHA" ]; then return 0; fi
              sleep 10
            done
            echo "the live site reports: ${last:-<no answer>}" >&2
            return 1
          }

          cli_pkg=vercel@latest
          cli_version=$(npx --yes vercel@latest --version 2>/dev/null | tail -1 || true)
          case $cli_version in
            [0-9]*.[0-9]*) cli_pkg="vercel@$cli_version" ;;
          esac
          echo "== vercel CLI: $cli_pkg =="

          blocked=""
          token_ok=no

          if [ -z "$token" ]; then
            blocked="VERCEL_TOKEN is empty in the repository scope."
          elif whoami_out="$(npx --yes "$cli_pkg" whoami --token="$token" 2>&1)"; then
            token_ok=yes
            printf '%s\n' "$whoami_out" | head -5
          else
            detail="$(printf '%s\n' "$whoami_out" | grep -iE "error|not valid|unauthorized|forbidden|denied|expired|invalid|not found" | head -3)"
            if [ -z "$detail" ]; then
              detail="$(printf '%s\n' "$whoami_out" | grep -v '^[[:space:]]*$' | tail -2)"
            fi
            flat="$(printf '%s' "$detail" | tr '\n' ' ' | cut -c1-300)"
            shape="length ${#token}, lines ${raw_lines}, raw_whitespace ${raw_ws}, sha256 $(fp "$token")"
            if printf '%s' "$whoami_out" | grep -qiE "user not found|404"; then
              blocked="Vercel authenticated VERCEL_TOKEN but could not resolve an account for it (404 'User not found') — the CLI's preflight GET /v2/user is denied for a token scoped to a team or to a single project. Token: $shape. $flat"
            elif printf '%s' "$whoami_out" | grep -qiE "not valid|NOT_AUTHORIZED|unauthorized|forbidden|401|403"; then
              blocked="Vercel rejected VERCEL_TOKEN — it did not authenticate. Token: $shape. $flat"
            elif printf '%s' "$whoami_out" | grep -qiE "ENOTFOUND|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN|getaddrinfo|socket hang up|network|TLS"; then
              blocked="the runner could not reach api.vercel.com: $flat"
            else
              blocked="vercel whoami failed. Token: $shape. $flat"
            fi
          fi

          if [ "$token_ok" = yes ] && [ -z "$blocked" ]; then
            if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
              mkdir -p .vercel
              printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
            else
              blocked="VERCEL_ORG_ID and/or VERCEL_PROJECT_ID are empty, so the CLI has no project to deploy to."
            fi
          fi

          deployed=no
          url=""
          if [ "$token_ok" = yes ] && [ -z "$blocked" ]; then
            set +e
            npx --yes "$cli_pkg" deploy --prod --yes --token="$token" 2>&1 | tee vercel-out.txt
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              deployed=yes
              url="$(grep -Eo 'https://[a-zA-Z0-9./-]+\.vercel\.app' vercel-out.txt | head -1 || true)"
            else
              blocked="the Vercel deploy failed (exit $rc). VERCEL_ORG_ID / VERCEL_PROJECT_ID most likely no longer match the project — check them against the project's Settings → General."
            fi
          fi

          FIX_HINT="create the token at vercel.com/account/tokens with scope Full Account and save it under repo Settings > Secrets and variables > Actions > Repository. The value it reads now fingerprints as sha256:$(fp "$token") (length ${#token}); after you save a new one, that fingerprint changes."
          if [ -n "$EXPECT_SHA" ]; then
            if wait_for_release 300; then
              if [ "$deployed" = yes ]; then
                if [ -n "$url" ]; then
                  echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
                  echo "Deployed: $url"
                fi
                exit 0
              fi
              echo "::warning::This job did not deploy, but production already serves $EXPECT_SHA — Vercel's GitHub App integration deployed it. Reason: $blocked"
              echo "::warning::Fix the deploy path: $FIX_HINT"
              {
                echo "### deploy-web — release is live, deploy path is broken"
                echo "- production serves: \`$EXPECT_SHA\`"
                echo "- why this job did not deploy: $blocked"
                echo "- VERCEL_TOKEN: length \`${#token}\`, sha256 \`$(fp "$token")\` (never printed)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Production is not serving $EXPECT_SHA and the deploy path is broken: $blocked"
            echo "::error::Fix the deploy path: $FIX_HINT"
            exit 1
          fi

          if [ "$deployed" = yes ]; then exit 0; fi
          echo "::error::The deploy did not happen: $blocked"
          echo "::error::Fix the deploy path: $FIX_HINT"
          exit 1

  smoke-web:
    needs: [gate, deploy-web]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record what this run can prove
        env:
          DEPLOY_RESULT: ${{ needs.deploy-web.result }}
          EXPECT: ${{ (github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'all' || github.event.client_payload.target == 'web' || github.event.client_payload.target == 'all') && github.sha || '' }}
        run: |
          {
            echo "### smoke-web"
            echo "- deploy-web: \`$DEPLOY_RESULT\`"
            if [ -n "$EXPECT" ]; then
              echo "- expecting production to report \`${EXPECT:0:12}\`"
              if [ "$DEPLOY_RESULT" != "success" ]; then
                echo "- deploy-web did not deploy, so this run tests whether Vercel's GitHub App integration deploys production on its own. A match means it does and deploy-web is redundant; a timeout means deploy-web is load-bearing."
              fi
            else
              echo "- no expected commit: standalone smoke run, checking whatever production serves now"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live site
        env:
          SMOKE_BASE: https://nowbey-v2.vercel.app
          EXPECT_SHA: ${{ (github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'all' || github.event.client_payload.target == 'web' || github.event.client_payload.target == 'all') && github.sha || '' }}
        run: node scripts/smoke-prod.mjs

  # EAS Android APK (preview / internal distribution). No iOS or Play Store yet — APK only,
  # distributed via the artifact URL Expo returns on a finished build.
  build-apk:
    needs: gate
    if: inputs.target == 'mobile' || inputs.target == 'all' || github.event.client_payload.target == 'mobile' || github.event.client_payload.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install Expo dependencies
        working-directory: expo
        run: npm ci --no-audit --no-fund

      # google-services.json is written from the FIREBASE_GOOGLE_SERVICES_JSON repo secret.
      # The root .easignore (used by EAS instead of every .gitignore) lets it travel to the worker
      # while staying out of Git.
      - name: Install Firebase Android configuration
        working-directory: expo
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${FIREBASE_GOOGLE_SERVICES_JSON:?Add the FIREBASE_GOOGLE_SERVICES_JSON repository secret}"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > google-services.json
          node -e 'const f=require("./google-services.json"); if (!f.project_info?.project_id || !f.client?.some(c => c.client_info?.android_client_info?.package_name === "app.nowbey.mobile")) throw new Error("google-services.json does not contain app.nowbey.mobile")'
          test -s google-services.json
          test -f ../.easignore
          if grep -qE '^[[:space:]]*google-services\.json' ../.easignore; then
            echo "::error title=Firebase config would not reach EAS::.easignore now ignores google-services.json, so it will not be in the uploaded archive. Remove that rule."
            exit 1
          fi
          echo "google-services.json ($(wc -c < google-services.json) bytes) is present and .easignore keeps it eligible for the EAS upload."

      - name: APK preflight (profile, Firebase, types, Android bundle)
        working-directory: expo
        run: npm run preflight:apk:full

      # Needs repo secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
      - name: Check EAS credentials
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          : "${EXPO_TOKEN:?Add the EXPO_TOKEN secret (repo Settings > Secrets and variables > Actions)}"
          set +e
          npx --yes eas-cli@latest whoami > eas-whoami.log 2>&1
          code=$?
          set -e
          cat eas-whoami.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=EAS rejected the EXPO_TOKEN::$(grep -v '^[[:space:]]*$' eas-whoami.log | tail -n 1 | tr -d '\r' | cut -c1-300)"
            exit "$code"
          fi

          # A token that authenticates is not the same as a token that is authorized on this
          # project: EAS answers "Entity Not Authorized" later, deep in the build step, naming
          # only a project UUID. Name the account here instead — as an annotation, so it is
          # readable without opening the job log — and export it for the failure report below.
          account="$(grep -v '^[[:space:]]*$' eas-whoami.log | tail -n 1 | tr -d '\r' | cut -c1-120)"
          echo "EAS_WHOAMI=$account" >> "$GITHUB_ENV"
          echo "::notice title=EXPO_TOKEN authenticates as::${account:-unknown}"
          {
            echo "### EAS credentials"
            echo ""
            echo "The \`EXPO_TOKEN\` secret authenticates as **${account:-unknown}**."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Android build to EAS (preview profile → APK)
        id: eas
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE: https://nowbey-v2.vercel.app
        run: |
          set -uo pipefail
          : "${EXPO_TOKEN:?Add the EXPO_TOKEN secret}"
          set +e
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json 2> eas-build.log
          code=$?
          set -e
          tail -n 80 eas-build.log

          field() { jq -r "$1" eas-build.json 2>/dev/null || true; }
          id="$(field '.[0].id // empty')"
          status="$(field '.[0].status // empty')"
          page="$(field '.[0] | select(.app.ownerAccount.name and .app.slug) | "https://expo.dev/accounts/\(.app.ownerAccount.name)/projects/\(.app.slug)/builds/\(.id)"')"
          apk="$(field '.[0].artifacts.buildUrl // empty')"
          error="$(field '.[0].error | select(.) | [.errorCode, .message] | map(select(.)) | join(": ")')"
          echo "EAS build ${id:-(no build record)}: ${status:-unknown} (CLI exit $code)"

          case "$status" in
            FINISHED)
              {
                echo "### EAS build finished"
                echo ""
                echo "Build page: ${page:-unknown}"
                if [ -n "$apk" ]; then
                  echo ""
                  echo "APK: $apk"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=EAS build finished::${apk:-${page:-build $id}}"
              exit 0
              ;;
            CANCELED|PENDING_CANCEL)
              echo "::error title=EAS build was cancelled::Build $id was cancelled on Expo's servers, so there is no APK. ${page}"
              ;;
            ERRORED)
              echo "::error title=EAS build failed on the worker::${error:-the build record has no error message} ${page}"
              ;;
            "")
              first="$(grep -v '^[[:space:]]*$' eas-build.log | tail -n 1 | tr -d '\r' | cut -c1-300 || true)"
              echo "::error title=EAS build failed (exit $code)::$first"
              ;;
            *)
              echo "::error title=EAS build ended $status::Build $id did not finish, so there is no APK. ${page}"
              ;;
          esac
          echo "--- full output ---"
          cat eas-build.log
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          exit 1

      - name: Upload the EAS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-log
          if-no-files-found: ignore
          path: |
            expo/eas-build.log
            expo/eas-build.json
            expo/eas-whoami.log

      - name: Report why the EAS build failed
        if: failure()
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          build_id="$(jq -r '.[0].id // empty' eas-build.json 2>/dev/null || true)"
          if [ -z "$build_id" ]; then
            build_id="$(grep -Eo 'https://expo\.dev/accounts/[^/[:space:]]+/projects/[^/[:space:]]+/builds/[0-9A-Fa-f-]+' eas-build.log 2>/dev/null | tail -n 1 | sed 's#.*/##' || true)"
          fi
          echo "build id: ${build_id:-none found in the log}"
          echo "EXPO_TOKEN authenticates as: ${EAS_WHOAMI:-unknown}"

          describe() { jq -r '(if type == "array" then .[0] else . end) | select(.) | [("status " + (.status // "unknown")), ((.error // {}) | [.errorCode, .message] | map(select(.)) | join(": "))] | map(select(. != "")) | join(" — ")' "$1" 2>/dev/null || true; }
          reason="$(describe eas-build.json)"
          if [ -z "$reason" ] && [ -n "$build_id" ]; then
            npx --yes eas-cli@latest build:view "$build_id" --json > eas-view.json 2> eas-view.err || true
            reason="$(describe eas-view.json)"
          fi
          if [ -n "$reason" ]; then
            reason="$(printf '%s\n\n%s' "$reason" "$(tail -n 40 eas-build.log 2>/dev/null | tr -d '\r' | head -c 8000)")"
          fi
          if [ -z "$reason" ]; then
            reason="$(tail -n 60 eas-build.log 2>/dev/null | tr -d '\r' | head -c 12000 || true)"
          fi
          if [ -z "$reason" ]; then
            reason="the EAS build failed and no output was captured"
          fi

          {
            echo "### Why the EAS build failed"
            echo ""
            echo "Build id: ${build_id:-unknown}"
            echo ""
            echo '```'
            printf '%s\n' "$reason"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The most common refusal is an account mismatch: the token belongs to an Expo account
          # that has no access to the NowBey project. The raw EAS message names two UUIDs and
          # nothing a person can act on, so translate it into the account and the project.
          case "$reason" in
            *"Not Authorized"*|*"not authorized"*)
              proj="$(node -e 'const a=require("./app.json");const e=a.expo||a;console.log((e.owner||"?")+"/"+(e.slug||"?")+" (projectId "+((e.extra&&e.extra.eas&&e.extra.eas.projectId)||"?")+")")' 2>/dev/null || echo unknown)"
              printf '::error title=EXPO_TOKEN is not authorized on this project::EXPO_TOKEN authenticates as %s, which cannot read project %s. Either invite %s to that project (expo.dev > project > Members), or replace the EXPO_TOKEN repository secret with a token created while logged in as the account that owns it.\n' "${EAS_WHOAMI:-unknown}" "$proj" "${EAS_WHOAMI:-unknown}"
              ;;
          esac

          payload="$(printf '%s' "$reason" | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/\r/,"%0D"); printf "%s%%0A", $0}')"
          printf '::error title=EAS build output::%s\n' "$payload"
