version: 2.1
workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - expo_env
      vars:
        EXPO_PUBLIC_API_BASE: "https://nowbey-v2.vercel.app"
    scripts:
      - name: Install dependencies
        script: |
          cd expo
          npm install
      - name: Expo Prebuild
        script: |
          cd expo
          npx expo prebuild --platform android --no-install
      - name: Build Android APK
        script: |
          cd expo/android
          chmod +x gradlew
          ./gradlew assembleRelease
