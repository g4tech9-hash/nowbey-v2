version: 2.1
workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1 # Using a Mac mini for better Android build stability
    environment:
      groups:
        - expo_env # You can create a group in Codemagic settings for your env vars
      vars:
        EXPO_PUBLIC_API_BASE: "https://nowbey-v2.vercel.app"
    scripts:
      - name: Install dependencies
        script: |
          cd expo
          npm install
      - name: Expo Prebuild
        script: |
          cd expo
          npx expo prebuild --platform android
      - name: Build Android APK
        script: |
          cd expo/android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - path: expo/android/app/build/outputs/apk/release/app-release.apk
        name: nowbey-apk.apk
