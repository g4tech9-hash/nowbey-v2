<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confessions</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1d1b19; --muted:#6b645c; --line:#e5dfd6; --accent:#8a3b2e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161412; --card:#201d1a; --ink:#f3eee7; --muted:#a39a8f; --line:#3a342d; --accent:#e08a74; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 32px; }
  textarea { width:100%; min-height: 120px; padding: 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  button { background: var(--accent); color:#fff; border:0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .status { color: var(--muted); font-size: .95rem; }
  .hp { position:absolute; left:-9999px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card p { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
  .when { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .wa { display:inline-block; margin-bottom: 24px; color: var(--accent); font-weight:600; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Confessions</h1>
  <p class="sub">Send yours in anonymously. Every confession is read before it shows up.</p>
  <a id="wa" class="wa" href="#" hidden>Join our WhatsApp</a>

  <form id="submit-form">
    <textarea id="text" maxlength="1000" placeholder="Type your confession here..." required></textarea>
    <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off">
    <div class="row">
      <span class="status" id="status">Max 1000 characters. No names, please.</span>
      <button type="submit" id="send">Send</button>
    </div>
  </form>

  <div id="list"><p class="empty">Loading...</p></div>
</main>
<script>
(async () => {
  try {
    const cfg = await (await fetch('/api/config')).json();
    if (cfg.whatsapp) {
      const a = document.getElementById('wa');
      a.href = cfg.whatsapp; a.hidden = false;
    }
  } catch {}

  const list = document.getElementById('list');
  function render(items) {
    list.replaceChildren();
    if (!items.length) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No confessions yet. Be the first.';
      list.append(p); return;
    }
    for (const c of items) {
      const card = document.createElement('div'); card.className = 'card';
      const p = document.createElement('p'); p.textContent = c.text;
      const when = document.createElement('div'); when.className = 'when';
      when.textContent = new Date(c.createdAt).toLocaleString();
      card.append(p, when); list.append(card);
    }
  }
  async function load() {
    try { render(await (await fetch('/api/confessions')).json()); }
    catch { list.textContent = 'Could not load confessions. Refresh the page.'; }
  }
  load();

  const form = document.getElementById('submit-form');
  const status = document.getElementById('status');
  const send = document.getElementById('send');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    send.disabled = true; status.textContent = 'Sending...';
    try {
      const res = await fetch('/api/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: document.getElementById('text').value, website: document.getElementById('website').value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send.');
      form.reset(); status.textContent = data.message;
    } catch (err) {
      status.textContent = err.message;
    } finally {
      send.disabled = false;
    }
  });
})();
</script>
</body>
</html>
